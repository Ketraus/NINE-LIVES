<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nine Lives</title>
  <style>
    html, body { margin: 0; padding: 0; background: #111; overflow: hidden; }
    #game-container { display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; }
    canvas { image-rendering: pixelated; }

    /* Console de hack (F9) — ver src/systems/DevConsole.js */
    #dev-console {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 420px;
      max-width: 90vw;
      background: rgba(20, 22, 28, 0.97);
      border: 2px solid #4fd1ff;
      border-radius: 6px;
      font-family: 'Consolas', 'Courier New', monospace;
      color: #fff;
      z-index: 1000;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.6);
    }
    #dev-console.hidden { display: none; }
    #dev-console-header {
      padding: 8px 12px;
      background: #22252e;
      color: #4fd1ff;
      font-size: 12px;
      letter-spacing: 0.5px;
      border-bottom: 1px solid #333;
    }
    #dev-console-output {
      max-height: 220px;
      overflow-y: auto;
      padding: 8px 12px;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    #dev-console-input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 8px 12px;
      background: #111319;
      color: #ffe9a8;
      border: none;
      border-top: 1px solid #333;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
  </style>
  <!-- Phaser carregado via CDN como script global — não precisa de npm install/build.
       Se a escola não tiver internet, baixe o arquivo e troque o src abaixo por um caminho local (ver README.md). -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container"></div>

  <div id="dev-console" class="hidden">
    <div id="dev-console-header">HACK CONSOLE — F9 pra fechar</div>
    <div id="dev-console-output"></div>
    <input id="dev-console-input" type="text" autocomplete="off" placeholder="ex: give dmg_up 3" />
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
